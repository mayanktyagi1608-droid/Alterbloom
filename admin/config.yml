backend:
  name: git-gateway
  branch: main

media_folder: "src/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/_data/home.json"
        fields:
          - { label: "SEO — Page title (search results). Leave blank to use the default.", name: "seo_title", widget: "string", required: false, hint: "About 50 to 60 characters. Say what you do and where." }
          - { label: "SEO — Description (search results)", name: "meta_description", widget: "text", required: false, hint: "About 150 characters. A plain sentence that makes someone want to click." }
          - label: "1. Invitation (the opening envelope)"
            name: "invitation"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small heading line (say what you do and where)", name: "eyebrow", widget: "string", hint: "This is the page's main heading for search engines. Keep London and the South East in it." }
              - { label: "Big heading", name: "title", widget: "string" }
              - { label: "Big heading: emphasised word", name: "title_accent", widget: "string" }
              - { label: "One-line promise", name: "lead", widget: "text", hint: "Shown only when the envelope animation is off (visitors who ask their device for reduced motion). The letter in the envelope shows the headings and the handwritten note." }
              - { label: "Handwritten note", name: "note", widget: "string" }
          - label: "2. Opening photo"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to show the placeholder." }
              - { label: "Photo description (what is in the picture; read by screen readers and search)", name: "alt", widget: "string", required: false }
              - { label: "Caption on the photo (optional)", name: "caption", widget: "string", required: false }
              - { label: "Focus: across (0 = left edge, 100 = right edge)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false, hint: "Phones show a narrow slice of wide photos. Set this to the part that matters." }
              - { label: "Focus: down (0 = top, 100 = bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false }
          - label: "3. Services (Pull up a chair)"
            name: "services"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Menu card label", name: "menu_label", widget: "string" }
              - { label: "Handwritten note", name: "note", widget: "string" }
              - label: "Services (4)"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "body", widget: "text" }
                  - { label: "Link label", name: "link_label", widget: "string" }
                  - { label: "Link to its page", name: "url", widget: "string", required: false, hint: "e.g. /weddings/. Leave blank until the page exists." }
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Photo description", name: "alt", widget: "string", required: false }
          - label: "4. The show (two photos)"
            name: "show"
            widget: "object"
            collapsed: true
            fields:
              - label: "Photos (2)"
                name: "photos"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to show the placeholder." }
                  - { label: "Photo description (what is in the picture; read by screen readers and search)", name: "alt", widget: "string", required: false }
                  - { label: "Caption on the photo (optional)", name: "caption", widget: "string", required: false }
                  - { label: "Focus: across (0 = left edge, 100 = right edge)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false, hint: "Phones show a narrow slice of wide photos. Set this to the part that matters." }
                  - { label: "Focus: down (0 = top, 100 = bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false }
          - label: "5. Why couples choose us"
            name: "proof"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Your story (handwritten note)", name: "story", widget: "text" }
              - { label: "Signature", name: "signature", widget: "string" }
              - { label: "Reviews label", name: "review_label", widget: "string" }
              - { label: "Reviews headline (e.g. 5.0 stars on Google)", name: "review_headline", widget: "string", hint: "Use the real figure. No made-up ratings." }
              - { label: "Reviews note", name: "review_note", widget: "string", required: false }
              - { label: "Client quote", name: "quote", widget: "text" }
              - { label: "Quote attribution", name: "quote_by", widget: "string" }
              - { label: "Directories label", name: "directories_label", widget: "string", required: false }
              - label: "Directories you are listed on"
                name: "directories"
                widget: "list"
                field: { label: "Name", name: "name", widget: "string" }
          - label: "6. Poppies photo"
            name: "poppies"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to show the placeholder." }
              - { label: "Photo description (what is in the picture; read by screen readers and search)", name: "alt", widget: "string", required: false }
              - { label: "Caption on the photo (optional)", name: "caption", widget: "string", required: false }
              - { label: "Focus: across (0 = left edge, 100 = right edge)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false, hint: "Phones show a narrow slice of wide photos. Set this to the part that matters." }
              - { label: "Focus: down (0 = top, 100 = bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false }
          - label: "7. How it works"
            name: "how"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "string" }
              - label: "Steps (3)"
                name: "steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "body", widget: "text" }
          - label: "8. Big line over a photo"
            name: "statement"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to show the placeholder." }
              - { label: "Photo description (what is in the picture; read by screen readers and search)", name: "alt", widget: "string", required: false }
              - { label: "Focus: across (0 = left edge, 100 = right edge)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false, hint: "Phones show a narrow slice of wide photos. Set this to the part that matters." }
              - { label: "Focus: down (0 = top, 100 = bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false }
              - { label: "Line", name: "text", widget: "string" }
              - { label: "Emphasised last word", name: "accent", widget: "string" }
          - label: "9. Photo gallery (swipe)"
            name: "gallery"
            widget: "object"
            collapsed: true
            fields:
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to show the placeholder." }
                  - { label: "Photo description (what is in the picture; read by screen readers and search)", name: "alt", widget: "string", required: false }
                  - { label: "Caption on the photo (optional)", name: "caption", widget: "string", required: false }
                  - { label: "Focus: across (0 = left edge, 100 = right edge)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false, hint: "Phones show a narrow slice of wide photos. Set this to the part that matters." }
                  - { label: "Focus: down (0 = top, 100 = bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50, required: false }
          - label: "10. FAQ"
            name: "faq"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{fields.question}}"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer (plain sentences; search and AI tools quote these)", name: "answer", widget: "text" }
          - label: "11. Journal heading (posts appear automatically)"
            name: "journal"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Link label", name: "link_label", widget: "string" }
          - label: "12. Enquiry card"
            name: "enquiry"
            widget: "object"
            collapsed: true
            hint: "The questions themselves are shared with the Contact page. Edit them under Pages > Enquiry Form."
            fields:
              - { label: "Small heading", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text", hint: "The reply-time sentence is added after this automatically. Edit it under Pages > Enquiry Form." }
              - { label: "Button label", name: "button", widget: "string" }

      - name: "about"
        label: "Our Story Page"
        file: "src/_data/about_page.json"
        fields:
          - { label: "SEO — Page title (search results). Leave blank to use the default.", name: "seo_title", widget: "string", required: false, hint: "About 50 to 60 characters. Say what you do and where." }
          - { label: "SEO — Description (search results)", name: "meta_description", widget: "text", required: false, hint: "About 150 characters. A plain sentence that makes someone want to click." }
          - { label: "1. Small heading line", name: "hero_eyebrow", widget: "string" }
          - { label: "1. Big heading", name: "hero_heading", widget: "string", hint: "This is the page's main heading for search engines." }
          - { label: "1. Story: paragraph 1", name: "story_body_1", widget: "text" }
          - { label: "1. Story: paragraph 2", name: "story_body_2", widget: "text" }
          - { label: "1. Story: paragraph 3 (optional)", name: "story_body_3", widget: "text", required: false }
          - { label: "1. Handwritten signature", name: "signature", widget: "string" }
          - { label: "1. Portrait: what the illustration shows (for screen readers)", name: "portrait_alt", widget: "string" }
          - { label: "1. Portrait: use a photo instead (optional)", name: "story_image", widget: "image", required: false, hint: "Leave empty to show the illustrated portrait of the two of you." }
          - { label: "1. Portrait photo: what it shows (for screen readers)", name: "story_image_alt", widget: "string", required: false }
          - label: "2. Full-width photo"
            name: "band"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "What the photo shows (for screen readers)", name: "alt", widget: "string", required: false }
              - { label: "Handwritten caption (optional)", name: "caption", widget: "string", required: false }
              - { label: "Focus point across (0 left, 100 right)", name: "focus_x", widget: "number", value_type: "int", min: 0, max: 100, default: 50 }
              - { label: "Focus point down (0 top, 100 bottom)", name: "focus_y", widget: "number", value_type: "int", min: 0, max: 100, default: 50 }
          - { label: "3. What we believe: small heading line", name: "values_eyebrow", widget: "string" }
          - { label: "3. What we believe: heading", name: "values_heading", widget: "string" }
          - label: "3. What we believe: 3 cards"
            name: "values"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - { label: "4. The two of you: small heading line", name: "team_eyebrow", widget: "string" }
          - { label: "4. The two of you: heading", name: "team_heading", widget: "string" }
          - label: "4. The two of you"
            name: "team"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "What you look after", name: "role", widget: "text" }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false }
              - { label: "What the photo shows (for screen readers)", name: "photo_alt", widget: "string", required: false }
          - { label: "5. Closing banner: heading", name: "cta_heading", widget: "string" }
          - { label: "5. Closing banner: body", name: "cta_body", widget: "text" }

      - name: "contact"
        label: "Enquire Page (the Contact page)"
        file: "src/_data/contact_page.json"
        fields:
          - { label: "SEO — Page title (search results). Leave blank to use the default.", name: "seo_title", widget: "string", required: false, hint: "About 50 to 60 characters. Say what you do and where." }
          - { label: "SEO — Description (search results)", name: "meta_description", widget: "text", required: false, hint: "About 150 characters. A plain sentence that makes someone want to click." }
          - { label: "Hero — Eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero — Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero — Body", name: "hero_body", widget: "text", hint: "The reply-time sentence is added after this automatically. Edit it under Pages > Enquiry Form." }
          - { label: "Form — Button label", name: "form_button", widget: "string", hint: "The questions themselves are shared with the home page. Edit them under Pages > Enquiry Form." }
          - { label: "Side note — Small heading", name: "aside_label", widget: "string", hint: "Above the email, phone and Instagram links. Those come from Site Settings." }
          - { label: "Side note — Handwritten line (optional)", name: "aside_note", widget: "string", required: false }

      - name: "enquiry_form"
        label: "Enquiry Form (the questions on Home and Contact)"
        file: "src/_data/enquiry_form.json"
        fields:
          - { label: "Reply time (one sentence, shown above the form on both pages)", name: "reply_note", widget: "string", hint: "For example: We reply within one working day." }
          - { label: "Names — label", name: "names_label", widget: "string" }
          - { label: "Email or phone — label", name: "contact_label", widget: "string" }
          - { label: "Occasion — label", name: "occasion_label", widget: "string" }
          - label: "Occasion — choices in the dropdown"
            name: "occasions"
            widget: "list"
            field: { label: "Occasion", name: "occasion", widget: "string" }
          - { label: "Date — label", name: "date_label", widget: "string" }
          - { label: "Date — helper text", name: "date_hint", widget: "string", required: false }
          - { label: "Place — label", name: "place_label", widget: "string" }
          - { label: "Place — prompt (first option in the dropdown)", name: "place_prompt", widget: "string" }
          - label: "Place — places in the dropdown (grouped)"
            name: "place_groups"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Group name (e.g. London)", name: "label", widget: "string" }
              - label: "Places"
                name: "places"
                widget: "list"
                field: { label: "Place", name: "place", widget: "string" }
          - { label: "One thing — label", name: "one_thing_label", widget: "string" }
          - { label: "Message — label", name: "message_label", widget: "string" }
          - { label: "Message — helper text", name: "message_hint", widget: "string", required: false }
          - { label: "Privacy line (under the button)", name: "privacy_note", widget: "string" }

      - name: "blog_intro"
        label: "Journal Page"
        file: "src/_data/blog_page.json"
        fields:
          - { label: "SEO — Page title (search results). Leave blank to use the default.", name: "seo_title", widget: "string", required: false, hint: "About 50 to 60 characters. Say what you do and where." }
          - { label: "SEO — Description (search results)", name: "meta_description", widget: "text", required: false, hint: "About 150 characters. A plain sentence that makes someone want to click." }
          - { label: "Hero — Eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero — Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero — Body", name: "hero_body", widget: "text" }
          - { label: "Signature under short notes (optional)", name: "signature", widget: "string", required: false }
          - { label: "Under every post — Banner heading", name: "post_cta_heading", widget: "string" }
          - { label: "Under every post — Banner body", name: "post_cta_body", widget: "text" }

      - name: "privacy"
        label: "Privacy Policy"
        file: "src/privacy.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last updated", name: "updated_date", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { name: "layout", widget: "hidden", default: "legal.njk" }
          - { name: "permalink", widget: "hidden", default: "/privacy/" }

      - name: "terms"
        label: "Terms & Conditions"
        file: "src/terms.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last updated", name: "updated_date", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { name: "layout", widget: "hidden", default: "legal.njk" }
          - { name: "permalink", widget: "hidden", default: "/terms/" }

      - name: "settings"
        label: "Site Settings (footer & contact info)"
        file: "src/_data/site.json"
        fields:
          - { label: "Footer statement (who you are, what you do, where)", name: "tagline", widget: "text" }
          - { label: "Default search description", name: "default_description", widget: "text", hint: "Used on any page without its own SEO description." }
          - { label: "Website address (no trailing slash, e.g. https://alterbloom.co.uk)", name: "url", widget: "string", required: false }
          - { label: "Social sharing image", name: "og_image", widget: "image", required: false, hint: "Shown when the site is shared. 1200 x 630 works best." }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone (displayed, e.g. 07752 082523)", name: "phone", widget: "string" }
          - { label: "Phone (link — international format, no spaces, e.g. +447752082523)", name: "phone_link", widget: "string" }
          - { label: "WhatsApp number (digits only, international, e.g. 447752082523)", name: "whatsapp_number", widget: "string", required: false, hint: "Leave blank to hide the WhatsApp buttons." }
          - { label: "WhatsApp opening message", name: "whatsapp_message", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string" }

  # The journal ("Christophe's desk"). Three kinds of post, all saved in src/posts.
  # Each kind is its own list here, so the editor only sees the fields that kind uses.
  - name: "blog"
    label: "Journal: Long reads"
    label_singular: "Long read"
    description: "A full piece with its own page."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    filter: { field: "kind", value: "long" }
    fields:
      - { label: "Kind", name: "kind", widget: "hidden", default: "long" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Wedding", "Corporate", "Planning", "Birthdays", "Florals", "Behind the Scenes"]
      - { label: "Excerpt (shown on the Journal page)", name: "excerpt", widget: "text" }
      - { label: "SEO — Page title (leave blank to use the post title)", name: "seo_title", widget: "string", required: false }
      - { label: "SEO — Description (leave blank to use the excerpt)", name: "meta_description", widget: "text", required: false }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Cover image alt text", name: "cover_image_alt", widget: "string", required: false }
      - { label: "Post body", name: "body", widget: "markdown" }

  - name: "notes"
    label: "Journal: Short notes"
    label_singular: "Short note"
    description: "A few sentences, shown in full on the Journal page. No page of its own."
    folder: "src/posts"
    create: true
    slug: "note-{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    filter: { field: "kind", value: "short" }
    fields:
      - { label: "Kind", name: "kind", widget: "hidden", default: "short" }
      - { label: "Name (for your own list here; not shown on the site)", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "The note", name: "body", widget: "markdown", hint: "Keep it to a few sentences." }

  - name: "instagram"
    label: "Journal: Instagram posts"
    label_singular: "Instagram post"
    description: "A picture card that links to the post on Instagram. No page of its own."
    folder: "src/posts"
    create: true
    slug: "instagram-{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    filter: { field: "kind", value: "instagram" }
    fields:
      - { label: "Kind", name: "kind", widget: "hidden", default: "instagram" }
      - { label: "Name (for your own list here; not shown on the site)", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Link to the Instagram post", name: "instagram_url", widget: "string", hint: "Open the post on Instagram, copy its link and paste it here." }
      - { label: "The picture", name: "image", widget: "image", hint: "Upload the same picture you posted. It is shown square." }
      - { label: "What the picture shows (for screen readers)", name: "image_alt", widget: "string" }
      - { label: "Caption", name: "caption", widget: "text", required: false }
